{% extends 'store/base.html' %}

{% block title %}Delete {{ supplier.name }}{% endblock %}

{% block content %}
<style>
    .delete-container {
        max-width: 600px;
        margin: 2rem auto;
        font-family: system-ui, -apple-system, sans-serif;
        background-color: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 1.5rem;
    }

    .delete-container h1 {
        margin: 0 0 0.5rem 0;
        font-size: 1.5rem;
        color: #111827;
    }

    .delete-container p {
        color: #6b7280;
        margin-bottom: 1.5rem;
    }

    .form-actions {
        display: flex;
        align-items: center;
        gap: 0.75rem;
    }

    .btn-delete-confirm {
        background-color: #dc2626;
        color: #ffffff;
        padding: 0.5rem 1rem;
        border: none;
        border-radius: 6px;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.2s ease;
    }

    .btn-delete-confirm:hover {
        background-color: #b91c1c;
    }

    .btn-cancel {
        display: inline-block;
        background-color: #ffffff;
        color: #374151;
        padding: 0.5rem 1rem;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 500;
        transition: all 0.2s ease;
    }

    .btn-cancel:hover {
        background-color: #f3f4f6;
        color: #111827;
    }
</style>

<div class="delete-container">
    <h1>Delete "{{ supplier.name }}"?</h1>
    <p>This action cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button type="submit" class="btn-delete-confirm">Yes, delete</button>
            <a href="{% url 'supplier_detail' supplier.pk %}" class="btn-cancel">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}

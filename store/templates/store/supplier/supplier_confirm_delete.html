{% extends 'store/base.html' %}

{% block title %}Delete {{ supplier.name }}{% endblock %}

{% block content %}
<div class="entity-container">
    <div class="entity-card">
        <h1>Delete "{{ supplier.name }}"?</h1>
        <p>This action cannot be undone.</p>
        <form method="post">
            {% csrf_token %}
            <div class="entity-form-actions">
                <button type="submit" class="danger">Yes, delete</button>
                <a href="{% url 'supplier_detail' supplier.pk %}" class="button secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% extends 'store/base.html' %}

{% block title %}{{ category.name }}{% endblock %}

{% block content %}
<div class="entity-container">
    <div class="entity-card">
        <h1>{{ category.name }}</h1>
        <p>{{ category.description|default:"No description." }}</p>
    </div>

    <div class="entity-actions">
        <a href="{% url 'category_update' category.pk %}" class="button">Edit</a>
        <a href="{% url 'category_delete' category.pk %}" class="button danger">Delete</a>
        <a href="{% url 'category_list' %}" class="button secondary">&larr; Back to list</a>
    </div>
</div>
{% endblock %}

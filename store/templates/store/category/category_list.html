{% extends 'store/base.html' %}

{% block title %}Categories{% endblock %}

{% block content %}
<div class="entity-container">
    <div class="entity-header">
        <h1>Categories</h1>
        <a href="{% url 'category_create' %}" class="button">+ Add Category</a>
    </div>

    {% if categories %}
        <ul class="entity-list">
            {% for category in categories %}
                <li class="entity-item">
                    <a href="{% url 'category_detail' category.pk %}" class="entity-link">
                        <span class="entity-link-main">{{ category.name }}</span>
                        <span class="entity-link-arrow">&rarr;</span>
                    </a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <div class="entity-empty">
            <p>No categories yet.</p>
        </div>
    {% endif %}
</div>
{% endblock %}

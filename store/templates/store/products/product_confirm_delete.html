{% extends 'store/base.html' %}
{% block title %}Delete {{ product.name }}{% endblock %}
{% block content %}
<h1>Delete "{{ product.name }}"?</h1>
<p>This can't be undone.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="danger">Yes, delete</button>
    <a href="{% url 'product_detail' product.pk %}" class="button">Cancel</a>
</form>
{% endblock %}

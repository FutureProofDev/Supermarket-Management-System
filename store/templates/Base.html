<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Supermarket Management System{% endblock %}</title>
</head>

<body>
    <nav>
        <a href="{% url 'category_list' %}">Categories</a>
        <!-- more links land here as each model gets its own list view -->
    </nav>

    {% if messages %}
    <ul class="messages">
        {% for message in messages %}
        <li>{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}

    <main>
        {% block content %}{% endblock %}
    </main>
</body>

</html>

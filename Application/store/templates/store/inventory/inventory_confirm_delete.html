{% extends 'store/base.html' %}
{% block title %}Delete {{ item.product }}{% endblock %}
{% block content %}
<h1>Delete inventory record for "{{ item.product }}"?</h1>
<p>This can't be undone.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="danger">Yes, delete</button>
    <a href="{% url 'inventory_detail' item.pk %}" class="button">Cancel</a>
</form>
{% endblock %}

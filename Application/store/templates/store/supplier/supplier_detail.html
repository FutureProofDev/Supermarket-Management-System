{% extends 'store/base.html' %}

{% block title %}{{ supplier.name }}{% endblock %}

{% block content %}
<div class="entity-container">
    <div class="entity-card">
        <h1>{{ supplier.name }}</h1>
        <div class="entity-detail-row">
            <span class="entity-detail-label">Phone</span>
            <span class="entity-detail-value">{{ supplier.contact_phone|default:"N/A" }}</span>
        </div>
        <div class="entity-detail-row">
            <span class="entity-detail-label">Email</span>
            <span class="entity-detail-value">{{ supplier.email|default:"N/A" }}</span>
        </div>
    </div>

    <div class="entity-actions">
        <a href="{% url 'supplier_update' supplier.pk %}" class="button">Edit</a>
        <a href="{% url 'supplier_delete' supplier.pk %}" class="button danger">Delete</a>
        <a href="{% url 'supplier_list' %}" class="button secondary">&larr; Back to list</a>
    </div>
</div>
{% endblock %}

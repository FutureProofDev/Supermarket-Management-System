{% extends 'store/base.html' %}
{% block title %}{{ employee }}{% endblock %}
{% block content %}
<div class="entity-container">
    <div class="entity-card">
        <h1>{{ employee }}</h1>
        <div class="entity-detail-row">
            <span class="entity-detail-label">Role</span>
            <span class="entity-detail-value">{{ employee.role }}</span>
        </div>
        <div class="entity-detail-row">
            <span class="entity-detail-label">Email</span>
            <span class="entity-detail-value">{{ employee.email|default:"N/A" }}</span>
        </div>
    </div>

    <div class="entity-actions">
        <a href="{% url 'employee_update' employee.pk %}" class="button">Edit</a>
        <a href="{% url 'employee_delete' employee.pk %}" class="button danger">Delete</a>
        <a href="{% url 'employee_list' %}" class="button secondary">&larr; Back to list</a>
    </div>
</div>
{% endblock %}
